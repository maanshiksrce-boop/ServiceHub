<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"><title>Create account | ServiceHub</title></head>
<body><header th:replace="~{fragments :: site-header}"></header><main><section class="form-shell"><div class="form-heading"><p class="eyebrow">Start simply</p><h1>Create your account</h1><p>Save your details and make your next booking faster.</p></div><form th:action="@{/register}" th:object="${registration}" method="post"><div class="form-grid"><div class="form-group full"><label for="fullName">Full name</label><input id="fullName" type="text" th:field="*{name}" placeholder="Your full name" required><small class="field-error" th:errors="*{name}"></small></div><div class="form-group"><label for="registerEmail">Email address</label><input id="registerEmail" type="email" th:field="*{email}" placeholder="you@example.com" required><small class="field-error" th:errors="*{email}"></small></div><div class="form-group"><label for="phone">Phone number</label><input id="phone" type="tel" th:field="*{phone}" placeholder="+91 98765 43210" required><small class="field-error" th:errors="*{phone}"></small></div><div class="form-group"><label for="registerPassword">Password</label><input id="registerPassword" type="password" th:field="*{password}" placeholder="Create a password" required><small class="field-error" th:errors="*{password}"></small></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Repeat your password" required><small class="field-error" th:errors="*{confirmPassword}"></small></div></div><button class="button form-submit" type="submit">Create account</button></form><p class="form-footer">Already have an account? <a th:href="@{/login}">Sign in</a></p></section></main><footer th:replace="~{fragments :: site-footer}"></footer><script th:src="@{/js/app.js}"></script></body></html>
